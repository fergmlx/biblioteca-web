<div class="modal-backdrop" (mousedown)="closed.emit()">
  <div
    [class]="'modal' + (wide() ? ' wide' : '') + (admin() ? ' admin' : '')"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (mousedown)="$event.stopPropagation()"
  >
    <div class="modal-head">
      <h2>{{ title() }}</h2>
      <button type="button" (click)="closed.emit()" aria-label="Cerrar"><app-icon name="x" [size]="18" /></button>
    </div>
    <div class="modal-body"><ng-content /></div>
    <div class="modal-foot"><ng-content select="[modalFooter]" /></div>
  </div>
</div>

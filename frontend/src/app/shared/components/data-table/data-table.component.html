<section class="card table-card">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          @for (h of headers(); track $index) {
            <th>{{ h }}</th>
          }
        </tr>
      </thead>
      <tbody>
        <ng-content />
      </tbody>
    </table>
  </div>
</section>

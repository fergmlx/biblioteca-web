<app-auth-shell>
  <span class="eyebrow">Recuperar acceso</span>
  @if (owner(); as o) {
    <h1>Crea una nueva contraseña</h1>
    <p>
      Cuenta: <strong>{{ o.email }}</strong>
    </p>
    <form (submit)="submit($event)" novalidate>
      <app-field label="Nueva contraseña" type="password" [required]="true" [(value)]="password" />
      <app-field label="Confirmar contraseña" type="password" [required]="true" [(value)]="confirm" />
      <button appBtn type="submit" class="full">Guardar contraseña</button>
    </form>
  } @else {
    <h1>Enlace no válido</h1>
    <p>Este enlace ya se usó o venció. Solicita uno nuevo para continuar.</p>
    <button appBtn class="full" (click)="ui.navigate('/recuperar')">Solicitar nuevo enlace</button>
  }
</app-auth-shell>
